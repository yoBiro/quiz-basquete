<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Cadastro</title>
    <link rel="stylesheet" href="../styles/confirmarCadastro.css">
    <h1>Cadastro</h1>
    
</head>
<body>

<div class="card">
    <section>
       <div> <img width="50" height="50" src="https://img.icons8.com/ios/50/name--v1.png" alt="name--v1" class="nome"/> <label for="">NOME: </label> <span></span></div>
       <div> <img width="50" height="50" src="https://img.icons8.com/glyph-neue/64/email-open.png" alt="email-open" class="email"> <label for="">EMAIL: </label> <span></span></div>
       <div> <img width="50" height="50" src="https://img.icons8.com/windows/32/birthday-date.png" alt="birthday-date"/> <label for="">DATA DE NASCIMENTO: </label> <span></span></div>
       <div> <img width="48" height="48" src="https://img.icons8.com/fluency-systems-filled/48/place-marker.png" alt="place-marker"/> <label for="">ENDEREÇO: </label> <span></span></div>
       <div> <img width="50" height="50" src="https://img.icons8.com/windows/32/filled-flag2--v2.png" alt="filled-flag2--v2" class="estado"/> <label for="">ESTADO: </label> <span></span></div>
       <div> <img width="50" height="50" src="https://img.icons8.com/metro/26/genderqueer.png" alt="genderqueer" class="genero"/> <label for="">SEXO: </label> <span></span></div>
       
    </section>
</div>
    <div class="div_impressora">
    <img class="impressora" src="/img/impressora.png" alt="">
            <p>Imprimir formulário</p>
    </div>

    <script type="module" src="../scripts/cadastro2.js"></script>
</body>
</html>
